name: Validate release

on:
  push:
    branches: [opensource]
    tags: ['v*']
  pull_request:
    branches: [opensource]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: macos-latest, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -c "import json, os; from pathlib import Path; version = json.loads(Path('.codex-plugin/plugin.json').read_text())['version']; assert os.environ['GITHUB_REF_NAME'] == 'v' + version"
      - name: Check public files
        run: python maintenance/check_release.py
      - name: Test release tools
        run: python -m unittest discover -s maintenance -p 'test_*.py'
      - name: Test document checker
        run: python -m unittest discover -s skills/organize-processor-docs/scripts -p 'test_*.py'
      - name: Test timing report extractor
        run: python -m unittest discover -s skills/trace-vivado-timing-to-rtl/scripts -p 'test_*.py'

  package:
    name: Build distribution
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build from this commit
        run: python maintenance/build_release.py --ref HEAD --output .runtime/release
      - uses: actions/upload-artifact@v4
        with:
          name: processor-development-skills-${{ github.sha }}
          path: .runtime/release/*
          if-no-files-found: error
